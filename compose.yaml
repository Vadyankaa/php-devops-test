
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - home-directory:/var/www/html/home
    networks:
      - sfm-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./src:/var/www/html
      - home-directory:/var/www/html/home
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - sfm-net

networks:
  sfm-net:
    driver: bridge

volumes:
  home-directory:
    driver: local
