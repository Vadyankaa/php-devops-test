---
- name: Deploy PHP FileManager
  hosts: all
  become: true

  vars:
    project_dir: "{{ app_deploy_dir }}"

  tasks:
    - name: Show deployment settings
      ansible.builtin.debug:
        msg:
          - "App: {{ app_name }}"
          - "Port: {{ app_port }}"
          - "Branch: {{ git_branch }}"
          - "Directory: {{ app_deploy_dir }}"
          - "Repository: {{ git_repo }}"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker, Compose plugin and Git
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Download application repository
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ project_dir }}"
        version: "{{ git_branch }}"
        update: true
        force: true

    - name: Deploy Compose configuration
      ansible.builtin.template:
        src: templates/compose.yaml.j2
        dest: "{{ project_dir }}/compose.deploy.yaml"
        mode: "0644"

    - name: Start application
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        files:
          - compose.deploy.yaml
        project_name: "{{ compose_project_name }}"
        state: present
        build: always